# Hermes Desktop: always use the GPU. The app has two "sticky" safety nets that
# switch it to software rendering (very laggy) after any launch that is cut
# short, and they stay on until the app or driver version changes. This machine's
# NVIDIA driver works, so both are turned off. Remove this file to restore them.
HERMES_DESKTOP_NVIDIA_SWIFTSHADER=0
HERMES_DESKTOP_DISABLE_GPU=0
